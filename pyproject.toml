[project]
name = "enacit4r-auth"
version = "0.7.0"
description = "Python authz utils for EPFL ENAC IT4R developments"
authors = [{ name = "ymarcon", email = "yannick.marcon@epfl.ch" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-keycloak>=4.7.0,<5",
    "fastapi>=0.115.4,<1.0.0",
    "pydantic>=2.9.2,<3",
]

[dependency-groups]
test = ["pytest>=8.3.3,<9"]
dev = ["pytest-asyncio>=0.24.0,<0.25"]

[tool.uv]
default-groups = ["test", "dev"]

[tool.hatch.build.targets.wheel]
packages = ["enacit4r_auth"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
